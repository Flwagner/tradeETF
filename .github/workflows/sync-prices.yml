name: Sync ETF prices

on:
  schedule:
    - cron: '0 9 * * *' # Every day at 9:00 UTC
  workflow_dispatch:
    inputs:
      with_boursobank:
        description: 'Refresh Boursobank top ETFs'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: prod
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Supabase env vars
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_PUBLISHABLE_KEY secrets."
            echo "These should already exist in the prod environment."
            exit 1
          fi

      - name: Sync prices (with Boursobank)
        if: >-
          github.event_name == 'schedule' ||
          github.event.inputs.with_boursobank == 'true'
        run: node scripts/sync-prices.mjs --with-boursobank

      - name: Sync prices (prices only)
        if: >-
          github.event_name != 'schedule' &&
          github.event.inputs.with_boursobank != 'true'
        run: node scripts/sync-prices.mjs
